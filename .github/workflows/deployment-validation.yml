name: Deployment validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: azure/setup-helm@v4
        with: {version: v3.19.0}
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest python/tests/test_production_deploy.py -q
      - run: bash -n deploy/public-up.sh scripts/deploy-kubernetes.sh
      - run: python -m py_compile deploy/vm/up.py scripts/verify-production.py
  workspace-edge:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kionga
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: kionga
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U kionga -d kionga'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kionga:integration-test-only@localhost:5432/kionga?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go/go.mod, cache-dependency-path: go/go.sum}
      - run: go test ./internal/store ./internal/httpapi ./internal/auth ./internal/runtimeconfig
        working-directory: go
