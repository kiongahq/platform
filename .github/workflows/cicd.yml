name: Platform CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:frontend
      - run: npm run type-check
      - run: npm run test:ui

  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:core
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: core-backend-browser-results
          path: artifacts/core-backend

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mlaiops
          POSTGRES_PASSWORD: mlaiops-ci
          POSTGRES_DB: mlaiops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mlaiops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: recursive        # contracts/, read by pipelinespec tests
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: gofmt -l . | tee /tmp/unformatted && test ! -s /tmp/unformatted
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -tags=integration ./integration
        env:
          TEST_DATABASE_URL: postgres://mlaiops:mlaiops-ci@localhost:5432/mlaiops?sslmode=disable
      - run: go test ./internal/httpapi -run TestPgvectorKnowledgeRoundTrip -count=1
        env:
          KIONGA_KNOWLEDGE_TEST_DSN: postgres://mlaiops:mlaiops-ci@localhost:5432/mlaiops?sslmode=disable
      - run: go test ./internal/httpapi -run TestQdrantKnowledgeRoundTrip -count=1
        env:
          KIONGA_QDRANT_TEST_URL: http://localhost:6333
      - run: go build ./cmd/...
      - name: Enforce architecture exclusions
        run: "! grep -RniE '\\b(nuclio|v3io|iguazio)\\b' ."

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0               # gitleaks scans the full history
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: govulncheck (fails on any called vulnerability)
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # Reviewed false positives carry "#nosec <rule> -- reason" at the site.
      - name: gosec
        working-directory: go
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet -exclude-dir=build -severity medium -confidence medium ./...
      # Fake credentials in redaction tests are pinned in .gitleaksignore.
      - name: gitleaks (full history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact .
