name: Agent Teams console

on:
  pull_request:
    paths:
      - frontend/**
      - tests/e2e/**
      - playwright*.cjs
      - package*.json
      - contracts
      - .github/workflows/teams-console.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teams-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix frontend --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.teams.config.cjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: teams-console-browser-results
          path: artifacts/
