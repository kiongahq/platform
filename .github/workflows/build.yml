name: Build & Publish Images

# Publishes the platform's Go services to ghcr.io/kiongahq/<service>. Other
# images are published by their own repositories (see kiongahq/deploy).
# Development: edge and SHA references. Releases: exact X.Y.Z and digest records.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [go/**, frontend/**, Dockerfile.gateway, .dockerignore, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, operator, integration-worker, feature-gateway, storage-proxy,
                  metrics-collector, log-exporter, cli]
    uses: kiongahq/.github/.github/workflows/image.yml@717e2cc3be707aff75c717662c6b3fea58ab56d8
    with:
      image: ${{ matrix.service }}
      context: ${{ matrix.service == 'gateway' && '.' || 'go' }}
      dockerfile: ${{ matrix.service == 'gateway' && 'Dockerfile.gateway' || 'Dockerfile' }}
      build-args: SERVICE=${{ matrix.service }}
