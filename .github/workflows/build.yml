name: Build & Publish Images

# Publishes the platform's Go services to ghcr.io/kiongahq/<service>. Other
# images are published by their own repositories (see kiongahq/deploy).
#   sha-<short>  every build      latest  default branch      X.Y.Z  v* tags
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: [go/**, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, operator, integration-worker, feature-gateway, storage-proxy,
                  metrics-collector, log-exporter, cli]
    uses: kiongahq/.github/.github/workflows/image.yml@main
    with:
      image: ${{ matrix.service }}
      context: go
      build-args: SERVICE=${{ matrix.service }}
