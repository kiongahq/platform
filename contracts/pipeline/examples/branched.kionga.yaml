# Example used by both the Go validator tests and the JSON Schema tests.
apiVersion: kionga.dev/v1
kind: Pipeline
metadata:
  name: churn-training
  project: prj-example
  version: "3"
  description: Nightly churn model training with parallel feature branches
spec:
  executionMode: prefect
  parameters:
    window: daily
    dataset_version: v12
  overridable:
    parameters: [window, dataset_version]
    resources: true
    nodes: true
  triggers:
    - type: schedule
      cron: "30 2 * * *"
      timezone: Africa/Nairobi
  nodes:
    - id: extract
      type: container
      image: ghcr.io/acme/churn@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      command: [python, -m, churn.extract]
      outputs: [raw]
    - id: features-usage
      type: container
      image: ghcr.io/acme/churn@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      command: [python, -m, churn.features, --kind, usage]
      dependsOn: [extract]
      resources: {cpu: "2", memory: 4Gi}
    - id: features-billing
      type: container
      image: ghcr.io/acme/churn@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      command: [python, -m, churn.features, --kind, billing]
      dependsOn: [extract]
      when: {param: window, equals: daily}
    - id: train
      type: container
      image: ghcr.io/acme/churn@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      command: [python, -m, churn.train]
      dependsOn: [features-usage, features-billing]
      resources: {cpu: "4", memory: 8Gi, gpu: 1}
      retry: {max: 2, backoffSeconds: 60}
      timeoutSeconds: 7200
