<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kionga workspace</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workspace.css">
</head>
<body class="workspace-page">
  <header class="workspace-toolbar">
    <div class="workspace-leading">
      <a class="workspace-back" id="back-console" href="/console.html">← Back to console</a>
      <div class="workspace-title">
        <span class="workspace-eyebrow">KIONGA WORKSPACE</span>
        <strong id="workspace-project">Shared workspace</strong>
      </div>
    </div>
    <div class="workspace-actions">
      <div class="workspace-switcher">
        <label for="workspace-tool">Open in</label>
        <select id="workspace-tool">
          <option value="workbench">JupyterLab</option>
          <option value="ide">Browser IDE</option>
        </select>
      </div>
      <span id="workspace-status" class="workspace-status" role="status">Checking your workspace…</span>
      <a class="workspace-logout" href="/auth/logout">Log out</a>
    </div>
  </header>
  <div class="workspace-loading">
    <div class="workspace-message" id="workspace-message" role="status">Preparing your workspace…</div>
    <button id="workspace-retry" hidden type="button">Retry</button>
  </div>
  <iframe id="workspace-frame" class="workspace-frame" title="Developer workspace" hidden allow="clipboard-read; clipboard-write"></iframe>
  <script src="/workspace.js"></script>
</body>
</html>
